<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="En cupcake och kakor" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Bild till det personliga projektet "Bagare". Egen illustration i sidans färger, på sandfärgad bakgrund. -->
  <rect width="800" height="450" fill="#F4EDE3"/>
  <!-- ljust valv bakom bakverken, samma form som i väderbilden -->
  <path d="M230,470 V210 A170,170 0 0 1 570,210 V470 Z" fill="#FAF4EC"/>
  <g transform="translate(0 32)">
  <circle cx="130" cy="90" r="80" fill="#E08E98" opacity="0.15"/>
  <circle cx="690" cy="320" r="110" fill="#C9AFBF" opacity="0.25"/>

  <!-- tallriken -->
  <ellipse cx="400" cy="338" rx="250" ry="26" fill="#2E1A26" opacity="0.08"/>
  <ellipse cx="400" cy="330" rx="240" ry="24" fill="#FFFFFF"/>

  <!-- cupcaken: form med ränder -->
  <path d="M330 222 L470 222 L452 330 L348 330 Z" fill="#C9AFBF"/>
  <g stroke="#8A6A7E" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="352" y1="230" x2="362" y2="324"/>
    <line x1="378" y1="230" x2="383" y2="324"/>
    <line x1="400" y1="230" x2="400" y2="324"/>
    <line x1="422" y1="230" x2="417" y2="324"/>
    <line x1="448" y1="230" x2="438" y2="324"/>
  </g>
  <!-- glasyren i tre lager -->
  <path d="M318 226 C306 196 336 180 360 186 C362 158 438 158 440 186 C464 180 494 196 482 226 Z" fill="#E08E98"/>
  <path d="M346 186 C350 152 378 140 400 140 C422 140 450 152 454 186 Z" fill="#E08E98"/>
  <path d="M372 146 C372 120 388 108 400 104 C412 108 428 120 428 146 Z" fill="#E08E98"/>
  <path d="M332 214 C340 200 356 198 366 204" fill="none" stroke="#F2C6CC" stroke-width="6" stroke-linecap="round"/>
  <path d="M362 170 C370 160 382 158 390 162" fill="none" stroke="#F2C6CC" stroke-width="6" stroke-linecap="round"/>
  <!-- strössel -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="398" y1="200" x2="406" y2="194" stroke="#FFFFFF"/>
    <line x1="436" y1="206" x2="444" y2="210" stroke="#2E1A26"/>
    <line x1="372" y1="208" x2="378" y2="216" stroke="#2E1A26"/>
    <line x1="420" y1="168" x2="426" y2="162" stroke="#FFFFFF"/>
    <line x1="458" y1="214" x2="464" y2="206" stroke="#FFFFFF"/>
  </g>
  <!-- körsbäret -->
  <path d="M404 92 C408 76 418 68 430 64" fill="none" stroke="#2E1A26" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="100" r="14" fill="#2E1A26"/>
  <circle cx="395" cy="95" r="4" fill="#FFFFFF" opacity="0.7"/>

  <!-- två kakor med chokladbitar -->
  <g>
    <circle cx="232" cy="300" r="46" fill="#D9B48F"/>
    <circle cx="232" cy="300" r="46" fill="none" stroke="#C49A72" stroke-width="3"/>
    <circle cx="214" cy="286" r="6" fill="#2E1A26"/><circle cx="246" cy="280" r="5" fill="#2E1A26"/>
    <circle cx="238" cy="312" r="6" fill="#2E1A26"/><circle cx="212" cy="316" r="4" fill="#2E1A26"/>
    <circle cx="258" cy="304" r="4" fill="#2E1A26"/>
  </g>
  <g>
    <circle cx="566" cy="304" r="40" fill="#D9B48F"/>
    <circle cx="566" cy="304" r="40" fill="none" stroke="#C49A72" stroke-width="3"/>
    <circle cx="552" cy="292" r="5" fill="#2E1A26"/><circle cx="578" cy="290" r="5" fill="#2E1A26"/>
    <circle cx="570" cy="316" r="6" fill="#2E1A26"/><circle cx="548" cy="314" r="4" fill="#2E1A26"/>
  </g>

  <!-- visp -->
  <g transform="translate(640 140) rotate(30)" fill="none" stroke="#2E1A26" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="40" x2="0" y2="110"/>
    <path d="M0 40 C-26 10 -20 -40 0 -46 C20 -40 26 10 0 40"/>
    <path d="M0 40 C-12 10 -10 -36 0 -46 C10 -36 12 10 0 40"/>
