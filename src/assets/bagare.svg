  <!-- små hjärtan -->
  <path d="M180 170 c-6 -9 -20 -4 -16 7 c3 7 16 14 16 14 s13 -7 16 -14 c4 -11 -10 -16 -16 -7z" fill="#E08E98"/>
  <path d="M600 90 c-4 -6 -13 -3 -11 4 c2 5 11 10 11 10 s9 -5 11 -10 c2 -7 -7 -10 -11 -4z" fill="#E08E98" opacity="0.7"/>
  </g>
