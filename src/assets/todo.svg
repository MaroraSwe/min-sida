<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="En lista med bockar" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Bild till projektkortet "Att göra". Samma färger som resten av sidan (index.css). -->
  <defs>
    <linearGradient id="bakgrund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEE3E9"/>
      <stop offset="1" stop-color="#FAF7F8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bakgrund)"/>
  <circle cx="150" cy="320" r="120" fill="#C9AFBF" opacity="0.25"/>
  <circle cx="680" cy="70" r="90" fill="#E08E98" opacity="0.15"/>

  <!-- papperet, lite snett -->
  <g transform="rotate(-4 400 200)">
    <rect x="262" y="62" width="276" height="300" rx="14" fill="#2E1A26" opacity="0.06"/>
    <rect x="256" y="52" width="276" height="300" rx="14" fill="#FFFFFF"/>
    <rect x="256" y="52" width="276" height="44" rx="14" fill="#E08E98"/>
    <rect x="256" y="78" width="276" height="18" fill="#E08E98"/>

    <!-- rad 1: klar -->
    <rect x="284" y="124" width="30" height="30" rx="7" fill="#E08E98"/>
    <path d="M291 139l7 7l12 -14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="332" y="133" width="150" height="12" rx="6" fill="#C9AFBF" opacity="0.6"/>

    <!-- rad 2: klar -->
    <rect x="284" y="184" width="30" height="30" rx="7" fill="#E08E98"/>
    <path d="M291 199l7 7l12 -14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="332" y="193" width="118" height="12" rx="6" fill="#C9AFBF" opacity="0.6"/>

    <!-- rad 3: inte klar än -->
    <rect x="286" y="246" width="26" height="26" rx="6" fill="none" stroke="#2E1A26" stroke-width="4"/>
    <rect x="332" y="253" width="168" height="12" rx="6" fill="#2E1A26" opacity="0.75"/>

    <!-- rad 4: inte klar än -->
    <rect x="286" y="306" width="26" height="26" rx="6" fill="none" stroke="#2E1A26" stroke-width="4"/>
    <rect x="332" y="313" width="96" height="12" rx="6" fill="#2E1A26" opacity="0.75"/>
  </g>

  <!-- pennan -->
  <g transform="rotate(35 590 250)">
    <rect x="566" y="150" width="24" height="170" rx="4" fill="#2E1A26"/>
    <rect x="566" y="150" width="24" height="26" rx="4" fill="#E08E98"/>
    <path d="M566 320 L590 320 L578 350 Z" fill="#C9AFBF"/>
    <path d="M574 340 L582 340 L578 350 Z" fill="#2E1A26"/>
