<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="En sol bakom ett regnmoln, inuti ett grönt valv" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Bild till projektkortet "Väder". Egen illustration: salviagrönt med plommonfärgade linjer. -->
  <rect width="800" height="450" fill="#FFFDFC"/>
  <!-- valvet: en ram med rundade hörn upptill -->
  <path d="M40,480 V190 A150,150 0 0 1 190,40 H610 A150,150 0 0 1 760,190 V480 Z" fill="#DCE8D8" stroke="#7E9C80" stroke-width="24"/>
  <!-- solen med strålar -->
  <g stroke="#2E1A26" stroke-width="6" stroke-linecap="round"><line x1="410.5" y1="154.1" x2="426.9" y2="142.6"/><line x1="385.0" y1="130.7" x2="395.0" y2="113.4"/><line x1="352.0" y1="120.3" x2="353.7" y2="100.4"/><line x1="317.6" y1="124.8" x2="310.8" y2="106.0"/><line x1="288.4" y1="143.4" x2="274.3" y2="129.3"/><line x1="269.8" y1="172.6" x2="251.0" y2="165.8"/><line x1="265.3" y1="207.0" x2="245.4" y2="208.7"/><line x1="275.7" y1="240.0" x2="258.4" y2="250.0"/></g>
  <circle cx="345" cy="200" r="62" fill="#FFFDF6" stroke="#2E1A26" stroke-width="6"/>
  <!-- molnet: först en tjock kant, sedan fyllningen ovanpå, så bara ytterkanten syns -->
  <g fill="#2E1A26" stroke="#2E1A26" stroke-width="12"><circle cx="390" cy="285" r="58"/><circle cx="470" cy="245" r="76"/><circle cx="555" cy="292" r="50"/><rect x="335" y="285" width="270" height="58" rx="29"/></g>
  <g fill="#B9D3B4"><circle cx="390" cy="285" r="58"/><circle cx="470" cy="245" r="76"/><circle cx="555" cy="292" r="50"/><rect x="335" y="285" width="270" height="58" rx="29"/></g>
  <path d="M372 318 H410" stroke="#E6F0E3" stroke-width="6" stroke-linecap="round"/>
  <!-- regnet -->
  <g stroke="#2E1A26" stroke-width="6" stroke-linecap="round"><line x1="385" y1="372" x2="379" y2="390"/><line x1="425" y1="372" x2="419" y2="390"/><line x1="465" y1="372" x2="459" y2="390"/><line x1="505" y1="372" x2="499" y2="390"/><line x1="545" y1="372" x2="539" y2="390"/><line x1="405" y1="408" x2="399" y2="426"/><line x1="445" y1="408" x2="439" y2="426"/><line x1="485" y1="408" x2="479" y2="426"/><line x1="525" y1="408" x2="519" y2="426"/></g>
