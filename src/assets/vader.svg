<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Sol, moln och lite regn" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Bild till projektkortet "Väder". Samma färger som resten av sidan (index.css). -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEE3E9"/>
      <stop offset="1" stop-color="#FAF7F8"/>
    </linearGradient>
  </defs>

  <!-- himmel och kulle -->
  <rect width="800" height="400" fill="url(#himmel)"/>
  <path d="M0 345 Q200 300 400 335 T800 325 V400 H0Z" fill="#C9AFBF" opacity="0.45"/>

  <!-- solen: ett sken, en rund sol och tolv strålar -->
  <g transform="translate(470 150)">
    <circle r="100" fill="#E08E98" opacity="0.15"/>
    <g stroke="#E08E98" stroke-width="9" stroke-linecap="round">
      <line x1="0" y1="-86" x2="0" y2="-112"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(30)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(60)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(90)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(120)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(150)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(180)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(210)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(240)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(270)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(300)"/>
      <line x1="0" y1="-86" x2="0" y2="-112" transform="rotate(330)"/>
    </g>
    <circle r="66" fill="#E08E98"/>
  </g>

  <!-- stort moln framför solen -->
  <ellipse cx="400" cy="304" rx="135" ry="12" fill="#2E1A26" opacity="0.06"/>
  <g fill="#FFFFFF">
    <circle cx="335" cy="250" r="46"/>
    <circle cx="395" cy="218" r="66"/>
    <circle cx="462" cy="244" r="52"/>
    <rect x="290" y="240" width="225" height="56" rx="28"/>
  </g>

  <!-- litet moln till höger -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="640" cy="104" r="26"/>
    <circle cx="672" cy="92" r="34"/>
    <circle cx="706" cy="108" r="24"/>
    <rect x="616" y="100" width="114" height="30" rx="15"/>
  </g>

  <!-- regnmoln till vänster -->
  <g fill="#C9AFBF">
    <circle cx="140" cy="128" r="28"/>
    <circle cx="176" cy="112" r="38"/>
    <circle cx="214" cy="130" r="26"/>
    <rect x="112" y="122" width="128" height="34" rx="17"/>
  </g>
  <g stroke="#C9AFBF" stroke-width="7" stroke-linecap="round">
    <line x1="140" y1="176" x2="132" y2="196"/>
    <line x1="176" y1="176" x2="168" y2="196"/>
    <line x1="212" y1="176" x2="204" y2="196"/>
    <line x1="158" y1="210" x2="150" y2="230"/>
    <line x1="194" y1="210" x2="186" y2="230"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
